system_base: |
  Eres un guionista experto en YouTube Shorts de alta retencion.
  Escribes en espanol neutro. Sin tildes en el output.
  Frases cortas. Maximo 15 palabras por oracion.
  Nunca uses: "increible", "alucinante", "sorprendente" como primera palabra.
  El hook ocupa los primeros 3 segundos (max 20 palabras).
  Estructura: hook -> desarrollo (3-4 beats) -> cierre con gancho de retencion.
  Output SIEMPRE en JSON valido, sin markdown, sin bloques de codigo.

niches:
  science:
    ideation:
      template: |
        Genera exactamente 6 ideas originales de videos sobre ciencia y naturaleza.
        Temas ya usados (NO repetir): {used_topics}
        Distribucion de puntuaciones obligatoria: exactamente 2 ideas con score 9-10,
        exactamente 2 con score 7-8, exactamente 2 con score 5-6.
        Cada idea debe tener un dato real verificable como nucleo.
        Formato JSON:
        {{"ideas": [{{"title": "...", "hook": "...", "score": 0}}]}}
        Ejemplos de ideas aceptables:
        {few_shots}
      few_shots:
        - topic: "fisica cuantica"
          output: |
            {{"title": "El tunel cuantico que hace imposible lo imposible",
              "hook": "Sabias que los electrones atraviesan paredes?",
              "score": 9}}
        - topic: "biologia extrema"
          output: |
            {{"title": "El animal que puede vivir sin agua 30 anos",
              "hook": "Esto es un tardígrado y no lo mata nada.",
              "score": 8}}
        - topic: "quimica cotidiana"
          output: |
            {{"title": "Por que el jabon destruye bacterias tan bien",
              "hook": "El jabon no mata germenes. Los disuelve.",
              "score": 6}}
    scripting:
      template: |
        Escribe un guion para YouTube Shorts sobre este tema:
        Titulo: {title}
        Hook sugerido: {hook}
        Voz asignada: {voice_id}
        Duracion maxima: {max_duration_s} segundos
        El guion debe tener: hook (max 20 palabras), desarrollo (3-4 beats de datos
        verificables), cierre con pregunta de retencion.
        Pausas marcadas con [pausa]. Sin tildes.
        Formato JSON:
        {{"title": "...", "hook": "...", "body": "...", "voice_id": "...",
          "duration_estimate_s": 0, "tags": ["..."], "description": "..."}}
        Ejemplos:
        {few_shots}
      few_shots:
        - topic: "tardigrado"
          output: |
            {{"title": "El animal que sobrevive al vacio del espacio",
              "hook": "Cual es el unico animal que sobrevive en el espacio?",
              "body": "El tardígrado mide 1 milimetro. [pausa] Resiste radiacion letal. Resiste el vacio del espacio. Resiste temperaturas de -272 grados. [pausa] Tiene 600 millones de anos en la Tierra. [pausa] Y todavia no sabemos por que es tan resistente.",
