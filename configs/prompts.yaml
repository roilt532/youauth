              "hook": "Por que no tenemos cables superconductores en todo el mundo?",
              "body": "Un superconductor conduce electricidad perfecta. [pausa] Cero resistencia. Cero perdida de energia. [pausa] El problema: necesita -196 grados para funcionar. [pausa] En 2023 se anuncio el primero a temperatura ambiente. Pero era falso.",
