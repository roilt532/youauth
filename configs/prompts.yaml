              "tags": ["fisica", "superconductor", "energia", "ciencia", "shorts"],
              "description": "La promesa que cambiaria el mundo. #fisica #ciencia #shorts"}}
        - topic: "efecto Mpemba"
          output: |
            {{"title": "El misterio del agua caliente que se congela antes",
              "hook": "El agua caliente se congela antes que la fria. Esto es real.",
              "body": "En 1963 un estudiante lo descubrio haciendo helado. [pausa] Su profesor no le creyó. [pausa] Hoy se llama efecto Mpemba. [pausa] Y todavia nadie sabe exactamente por que ocurre.",
              "voice_id": "alvaro_es",
              "duration_estimate_s": 35,
              "tags": ["fisica", "agua", "misterio", "efecto Mpemba", "shorts"],
              "description": "El misterio que desafia la fisica. #fisica #misterio #shorts"}}

