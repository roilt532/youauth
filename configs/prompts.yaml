system_base: |
  Eres un guionista experto en YouTube Shorts de alta retencion.
  Escribes en espanol neutro. Sin tildes en el output.
  Frases cortas. Maximo 15 palabras por oracion.
  Nunca uses: "increible", "alucinante", "sorprendente" como primera palabra.
  El hook ocupa los primeros 3 segundos (max 20 palabras).
  Output SIEMPRE en JSON valido, sin markdown, sin bloques de codigo.

niches:
  science:
    ideation:
      template: |
        Genera exactamente 6 ideas originales de videos sobre ciencia y naturaleza.
        Temas ya usados en los ultimos 30 dias (NO repetir): {used_topics}
        Distribucion obligatoria de scores:
          - exactamente 2 ideas con estimated_engagement_score 9 o 10
          - exactamente 2 ideas con estimated_engagement_score 7 u 8
          - exactamente 1 idea con estimated_engagement_score 5 o 6
          - exactamente 1 idea con estimated_engagement_score 3 o 4
        Cada idea debe tener un dato real verificable como nucleo.
        Formato JSON obligatorio:
        {{"ideas": [
          {{"hook": "primera frase del video max 20 palabras",
            "topic": "tema central del video en 3-6 palabras",
            "angle": "el angulo narrativo especifico en 5-10 palabras",
            "estimated_engagement_score": 9}}
        ]}}
        Ejemplos de ideas bien formadas:
        {few_shots}
      few_shots:
        - topic: "efecto tunel cuantico"
          output: |
            {{"hook": "Sabias que los electrones atraviesan paredes?",
              "topic": "efecto tunel cuantico",
              "angle": "aplicacion practica que ya usas sin saberlo (memorias flash)",
              "estimated_engagement_score": 9}}
        - topic: "tardigrado extremofilo"
          output: |
            {{"hook": "Esto es el unico animal que sobrevive en el vacio del espacio.",
              "topic": "resistencia extrema del tardígrado",
              "angle": "comparar sus limites con los del ser humano beat a beat",
              "estimated_engagement_score": 8}}
        - topic: "efecto Mpemba"
          output: |
            {{"hook": "El agua caliente se congela antes que la fria. Esto es real.",
              "topic": "efecto Mpemba y por que sigue sin explicacion",
              "angle": "historia del estudiante que lo descubrio y como lo ignoraron",
              "estimated_engagement_score": 6}}
    scripting:
      template: |
        Escribe un guion completo para YouTube Shorts sobre este tema:
        Hook sugerido: {hook}
        Tema central: {topic}
        Angulo narrativo: {angle}
        Nicho: {niche_id}
        Duracion maxima: {max_duration_s} segundos
        Voces disponibles para este nicho (elige una): {voice_catalog}
        Fondos disponibles (elige uno segun el tono): {background_options}
        Estructura obligatoria:
          - hook_text: OBLIGATORIO: termina en "?" o empieza con Sabias/Nunca/Cual/Como/Cuando/Por que/Donde/Quien/Esto/En/Nadie/Habia (max 20 palabras)
          - body_lines: lista de 4 a 6 oraciones cortas del desarrollo, cada una max 15 palabras
          - payoff_text: cierre tipo cliffhanger o llamada a reflexion (segundos 50-58, max 20 palabras)
          - total_duration_estimate_s: estimado total en segundos (debe ser <= {max_duration_s})
          - suggested_voice_id: uno de [{voice_catalog}]
          - suggested_background_niche: uno de [{background_options}]
        Sin tildes. Output SOLO JSON valido.
        Formato:
        {{"hook_text": "...",
          "body_lines": ["...", "...", "...", "..."],
          "payoff_text": "...",
          "total_duration_estimate_s": 0,
          "suggested_voice_id": "...",
          "suggested_background_niche": "..."}}
        Ejemplos:
        {few_shots}
      few_shots:
        - topic: "tardígrado"
          output: |
            {{"hook_text": "Cual es el unico animal que sobrevive en el espacio?",
              "body_lines": [
                "El tardígrado mide 1 milimetro.",
                "Resiste radiacion letal y el vacio del espacio.",
                "Sobrevive temperaturas de -272 grados.",
                "Lleva 600 millones de anos en la Tierra.",
                "Y todavia no sabemos como lo hace."
              ],
              "payoff_text": "La ciencia tampoco lo entiende. Comentanos tu teoria.",
              "total_duration_estimate_s": 42,
              "suggested_voice_id": "alvaro_es",
              "suggested_background_niche": "gameplay_generic"}}
        - topic: "superconductor a temperatura ambiente"
          output: |
            {{"hook_text": "Por que no tenemos cables superconductores en todo el mundo?",
              "body_lines": [
                "Un superconductor conduce electricidad sin perder energia.",
                "Cero resistencia. Cero calor perdido.",
                "El problema: necesita -196 grados para funcionar.",
                "En 2023 se anuncio el primero a temperatura ambiente.",
                "Pero era falso. El paper fue retractado."
              ],
              "payoff_text": "El dia que lo logren, el mundo cambia. Puede que ya este pasando.",
              "total_duration_estimate_s": 40,
              "suggested_voice_id": "elvira_es",
              "suggested_background_niche": "minecraft_parkour"}}
        - topic: "efecto Mpemba"
          output: |
            {{"hook_text": "El agua caliente se congela antes que la fria. Esto es real.",
              "body_lines": [
                "En 1963 un estudiante lo descubrio haciendo helado.",
                "Su profesor no le creyó.",
                "Hoy se llama efecto Mpemba.",
                "La fisica clasica no lo explica bien.",
                "Hay 40 teorias distintas. Ninguna cerrada."
              ],
              "payoff_text": "Todavia debatimos algo que un nino descubrio con helado.",
