name: Upload Videos

on:
  workflow_run:
    workflows:
      - "Generate Videos"
    types:
      - completed  # triggers on success AND failure - upload whatever made it to R2
  workflow_dispatch:
    inputs:
      privacy:
        description: "Privacy status for uploaded videos"
        required: true
        default: "unlisted"
        type: choice
        options:
          - public
          - unlisted
          - private

jobs:
  upload:
    name: Upload pending videos to YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: upload
      cancel-in-progress: false  # never interrupt an in-progress upload

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -e ".[dev,test]"

      - name: Upload pending videos
        run: alvaro upload --max-videos 5 --privacy "${{ inputs.privacy || 'public' }}"
